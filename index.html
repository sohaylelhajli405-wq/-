<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM - Chapitre 1 : L'économie de marché (Luffy Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0f4f8; }
        .font-duo { font-family: 'Fredoka', sans-serif; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        @keyframes luffy-jump {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-20px) scale(1.15) rotate(10deg); }
        }
        .animate-luffy-happy { animation: luffy-jump 0.5s ease-in-out infinite; }

        @keyframes luffy-angry {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-8deg); }
            75% { transform: scale(1.1) rotate(8deg); }
        }
        .animate-luffy-angry { animation: luffy-angry 0.3s ease-in-out infinite; }

        .option-btn {
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 #cbd5e1;
        }
        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cbd5e1;
        }
        .option-btn.selected {
            border-color: #f59e0b;
            background-color: #fef3c7;
            box-shadow: 0 4px 0 #d97706;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Top Navigation -->
    <header class="bg-red-600 border-b-4 border-red-800 py-4 px-6 text-white shadow-md">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🍖</span>
                <span class="font-duo font-bold text-2xl tracking-wider">LUFFY QCM</span>
            </div>
            <span class="bg-amber-400 text-slate-900 font-extrabold px-3 py-1 rounded-full text-xs uppercase tracking-wider">CPGE • Économie</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl w-full mx-auto px-4 py-6 flex-grow flex flex-col justify-center">

        <!-- Intro Card -->
        <div id="intro-card" class="bg-white rounded-3xl border-4 border-slate-800 p-8 text-center shadow-[0_8px_0_#1e293b]">
            <div id="intro-mascot" class="text-7xl mb-4 transition-transform duration-300 hover:scale-110 cursor-pointer">🐵👒</div>
            <h1 class="font-duo text-2xl md:text-4xl font-extrabold text-slate-900 mb-2">Prêt à devenir le roi des pirates de l'économie ?</h1>
            <p class="text-slate-600 font-bold mb-6">20 questions intenses. Rends Luffy fier et décroche le trésor !</p>
            <button id="start-btn" class="w-full bg-red-500 hover:bg-red-600 text-white font-duo font-extrabold text-xl py-4 rounded-2xl transition shadow-[0_6px_0_#991b1b] active:translate-y-1.5 active:shadow-none">
                JOUER AVEC LUFFY 🚀
            </button>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="hidden space-y-6">
            
            <!-- Progress Bar -->
            <div class="flex items-center gap-4">
                <div class="flex-grow bg-slate-200 h-5 rounded-full overflow-hidden p-0.5 border-2 border-slate-800">
                    <div id="progress-bar" class="bg-amber-400 h-full rounded-full transition-all duration-300" style="width: 5%;"></div>
                </div>
                <span id="question-count" class="font-extrabold text-slate-700 text-base">1/20</span>
            </div>

            <!-- Mascot Dialogue Header -->
            <div class="flex items-start gap-4 bg-white p-4 rounded-3xl border-4 border-slate-800 shadow-[0_4px_0_#1e293b]">
                <div id="mascot" class="text-5xl transition-transform duration-300">🍖</div>
                <div class="relative bg-amber-50 p-3.5 rounded-2xl rounded-tl-none border-2 border-slate-800 text-base font-extrabold text-slate-800 flex-grow">
                    <span id="mascot-speech">Shishishi ! Choisis la bonne réponse !</span>
                </div>
            </div>

            <!-- Question Box -->
            <div id="question-card" class="space-y-4">
                <h2 id="question-title" class="font-duo text-lg md:text-xl font-bold text-slate-900 leading-snug"></h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

        </div>

        <!-- Results Container -->
        <div id="result-container" class="hidden bg-white rounded-3xl border-4 border-slate-800 p-8 text-center shadow-[0_8px_0_#1e293b]">
            <div id="result-mascot" class="text-8xl mb-4">👑</div>
            <h2 class="font-duo text-3xl font-extrabold text-slate-900 mb-2">Aventure terminée !</h2>
            <p class="text-slate-600 font-bold mb-4">Ton score final :</p>
            <div id="score-display" class="text-6xl font-duo font-extrabold text-red-600 mb-6">0 / 20</div>
            <p id="score-feedback" class="text-slate-800 font-extrabold mb-8 text-lg"></p>
            <button id="restart-btn" class="w-full bg-red-500 hover:bg-red-600 text-white font-duo font-extrabold text-lg py-4 rounded-2xl transition shadow-[0_6px_0_#991b1b] active:translate-y-1.5 active:shadow-none">
                RECOMMENCER L'AVENTURE
            </button>
        </div>

    </main>

    <!-- Interactive Footer Action Bar -->
    <footer id="footer-bar" class="hidden border-t-4 border-slate-800 bg-white py-4 px-6">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div id="feedback-message" class="hidden items-center gap-3">
                <span id="feedback-icon" class="text-3xl"></span>
                <div>
                    <h4 id="feedback-title" class="font-duo font-extrabold text-lg"></h4>
                    <p id="feedback-sub" class="text-xs font-bold"></p>
                </div>
            </div>
            <button id="check-btn" disabled class="ml-auto bg-slate-200 text-slate-400 font-duo font-extrabold px-8 py-3.5 rounded-2xl transition cursor-not-allowed">
                VÉRIFIER
            </button>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const questions = [
                {
                    question: "1. Sur le plan théorique, qu'est-ce qu'une « économie de marché » ?",
                    options: [
                        "Un modèle où la coordination s'opère par la confrontation de l'offre et de la demande",
                        "Un système où toutes les décisions sont prises par l'État",
                        "Un marché unique réservé aux transactions agricoles",
                        "Un système économique sans aucune règle"
                    ],
                    correct: 0
                },
                {
                    question: "2. Quel est le rôle principal des prix dans une économie de marché ?",
                    options: [
                        "Fixer les salaires minimaux obligatoires",
                        "Servir de véhicules d'information, d'incitation et de coordination",
                        "Empêcher totalement l'apparition d'externalités",
                        "Garantir une égalité stricte des revenus"
                    ],
                    correct: 1
                },
                {
                    question: "3. Parmi les propositions suivantes, laquelle ne fait PAS partie des 4 fondamentaux du marché ?",
                    options: [
                        "Les droits de propriété",
                        "La théorie de la valeur",
                        "La planification intégrale de la production",
                        "La monnaie"
                    ],
                    correct: 2
                },
                {
                    question: "4. Selon la théorie économique moderne, sur quoi s'appuie principalement la valeur d'échange ?",
                    options: [
                        "Le coût du travail uniquement",
                        "L'utilité et la rareté",
                        "Le temps de travail socialement nécessaire",
                        "La décision unilatérale de l'État"
                    ],
                    correct: 1
                },
                {
                    question: "5. Quelles sont les 5 conditions structurelles de la Concurrence Pure et Parfaite (CPP) ?",
                    options: [
                        "Atomicité, homogénéité, libre entrée, transparence, mobilité des facteurs",
                        "Monopole, asymétrie d'information, différenciation, rigidité, stabilité",
                        "Transparence, intervention de l'État, interdiction d'exporter, flexibilité",
                        "Cartel, oligopole, fixation des prix, protectionnisme"
                    ],
                    correct: 0
                },
                {
                    question: "6. Que stipule la « loi de la demande » formulée par Alfred Marshall ?",
                    options: [
                        "La quantité demandée augmente quand le prix augmente",
                        "Toutes choses égales par ailleurs, la quantité demandée diminue quand le prix augmente",
                        "La demande est insensible aux prix",
                        "Le prix est fixe"
                    ],
                    correct: 1
                },
                {
                    question: "7. Qu'appelle-t-on « biens de Giffen » ?",
                    options: [
                        "Des biens de luxe dont la demande augmente avec le snobisme",
                        "Des biens de première nécessité dont la demande augmente quand leur prix augmente",
                        "Des biens supérieurs",
                        "Des services publics"
                    ],
                    correct: 1
                },
                {
                    question: "8. Comment qualifie-t-on un bien dont l'élasticité-revenu est comprise entre 0 et 1 ?",
                    options: [
                        "Un bien inférieur",
                        "Un bien de luxe",
                        "Un bien normal (nécessaire)",
                        "Un bien indépendant"
                    ],
                    correct: 2
                },
                {
                    question: "9. Si l'élasticité-prix croisée entre deux biens X et Y est positive, ils sont :",
                    options: [
                        "Complémentaires",
                        "Substituables",
                        "Indépendants",
                        "Inférieurs"
                    ],
                    correct: 1
                },
                {
                    question: "10. Quelle est l'allure générale de la courbe d'offre d'un bien ?",
                    options: [
                        "Décroissante",
                        "Croissante : plus le prix est élevé, plus l'offre augmente",
                        "Horizontale",
                        "Verticale"
                    ],
                    correct: 1
                },
                {
                    question: "11. Que se passe-t-il lorsque le prix est supérieur au prix d'équilibre (Offre > Demande) ?",
                    options: [
                        "Pénurie",
                        "Excédent (surplus), entraînant une baisse du prix",
                        "Disparition des producteurs",
                        "Blocage définitif"
                    ],
                    correct: 1
                },
                {
                    question: "12. Qui est l'auteur de la métaphore de la « main invisible » ?",
                    options: [
                        "Keynes",
                        "Walras",
                        "Adam Smith",
                        "Karl Marx"
                    ],
                    correct: 2
                },
                {
                    question: "13. Qu'est-ce qu'un « optimum de Pareto » ?",
                    options: [
                        "Chacun est parfaitement égal",
                        "Situation où l'on ne peut améliorer le sort d'un agent sans détériorer celui d'un autre",
                        "Un système de taxe",
                        "Un équilibre de sous-emploi"
                    ],
                    correct: 1
                },
                {
                    question: "14. Quelle situation illustre une externalité négative ?",
                    options: [
                        "Une campagne de vaccination",
                        "Une usine polluante près d'un quartier résidentiel",
                        "Une découverte scientifique",
                        "L'éclairage public"
                    ],
                    correct: 1
                },
                {
                    question: "15. Qu'est-ce que la « tragédie des biens communs » ?",
                    options: [
                        "La surexploitation des ressources à accès libre et rivales",
                        "La faillite des entreprises publiques",
                        "La baisse des impôts",
                        "La crise financière"
                    ],
                    correct: 0
                },
                {
                    question: "16. Qu'appelle-t-on « sélection adverse » ?",
                    options: [
                        "Un vice caché après signature du contrat",
                        "L'élimination des bons produits du marché à cause de l'asymétrie d'information",
                        "Une politique monétaire",
                        "Un monopole d'État"
                    ],
                    correct: 1
                },
                {
                    question: "17. Quelle est la position des économistes keynésiens ?",
                    options: [
                        "Le marché s'autorégule parfaitement",
                        "Le marché peut rester bloqué en sous-emploi et nécessite l'intervention de l'État",
                        "L'État doit être supprimé",
                        "Les prix sont fixes à jamais"
                    ],
                    correct: 1
                },
                {
                    question: "18. Qu'est-ce qu'un « monopole » ?",
                    options: [
                        "Plusieurs vendeurs",
                        "Un seul vendeur face à une multitude d'acheteurs",
                        "Un marché d'acheteurs uniques",
                        "Une concurrence parfaite"
                    ],
                    correct: 1
                },
                {
                    question: "19. Caractéristique majeure de la « concurrence monopolistique » :",
                    options: [
                        "Produit unique sans rival",
                        "Multitude d'offreurs proposant des produits différenciés",
                        "Deux vendeurs uniquement",
                        "Interdiction de faire de la pub"
                    ],
                    correct: 1
                },
                {
                    question: "20. Que soutenaient les physiocrates au XVIIIe siècle ?",
                    options: [
                        "Le mercantilisme strict",
                        "L'ordre naturel : « Laissez faire les hommes, laissez passer les marchandises »",
                        "Le socialisme centralisé",
                        "L'abandon de l'agriculture"
                    ],
                    correct: 1
                }
            ];

            let currentQuestion = 0;
            let selectedOption = null;
            let userAnswers = new Array(questions.length).fill(null);
            let isChecked = false;

            const introCard = document.getElementById('intro-card');
            const quizContainer = document.getElementById('quiz-container');
            const resultContainer = document.getElementById('result-container');
            const questionTitle = document.getElementById('question-title');
            const optionsContainer = document.getElementById('options-container');
            const progressBar = document.getElementById('progress-bar');
            const questionCount = document.getElementById('question-count');
            const mascot = document.getElementById('mascot');
            const mascotSpeech = document.getElementById('mascot-speech');
            const footerBar = document.getElementById('footer-bar');
            const checkBtn = document.getElementById('check-btn');
            const feedbackMessage = document.getElementById('feedback-message');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackSub = document.getElementById('feedback-sub');

            function playSound(type) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.setValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                }
            }

            document.getElementById('start-btn').addEventListener('click', function() {
                introCard.classList.add('hidden');
                quizContainer.classList.remove('hidden');
                footerBar.classList.remove('hidden');
                loadQuestion();
            });

            function loadQuestion() {
                isChecked = false;
                selectedOption = null;
                const q = questions[currentQuestion];

                questionTitle.textContent = q.question;
                questionCount.textContent = `${currentQuestion + 1}/${questions.length}`;
                progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

                mascot.textContent = '🍖';
                mascot.className = 'text-5xl transition-transform duration-300';
                mascotSpeech.textContent = "Shishishi ! À toi de jouer !";

                footerBar.className = "border-t-4 border-slate-800 bg-white py-4 px-6";
                feedbackMessage.className = "hidden items-center gap-3";
                checkBtn.disabled = true;
                checkBtn.textContent = "VÉRIFIER";
                checkBtn.className = "ml-auto bg-slate-200 text-slate-400 font-duo font-extrabold px-8 py-3.5 rounded-2xl transition cursor-not-allowed";

                optionsContainer.innerHTML = '';
                q.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left p-4 rounded-2xl border-2 border-slate-800 bg-white font-extrabold text-slate-700 hover:bg-slate-50 flex items-center justify-between";
                    btn.innerHTML = `<span>${option}</span><span class="w-6 h-6 rounded-full border-2 border-slate-400 flex items-center justify-center text-xs text-transparent">✓</span>`;
                    btn.onclick = function() { selectOption(index, btn); };
                    optionsContainer.appendChild(btn);
                });
            }

            function selectOption(index, btn) {
                if (isChecked) return;
                selectedOption = index;

                Array.from(optionsContainer.children).forEach((child) => {
                    child.className = "option-btn w-full text-left p-4 rounded-2xl border-2 border-slate-800 bg-white font-extrabold text-slate-700 hover:bg-slate-50 flex items-center justify-between";
                    child.querySelector('span:last-child').className = "w-6 h-6 rounded-full border-2 border-slate-400 flex items-center justify-center text-xs text-transparent";
                });

                btn.className = "option-btn selected w-full text-left p-4 rounded-2xl border-2 border-amber-500 bg-amber-50 font-extrabold text-slate-900 flex items-center justify-between";
                btn.querySelector('span:last-child').className = "w-6 h-6 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-bold";

                checkBtn.disabled = false;
                checkBtn.className = "ml-auto bg-red-500 hover:bg-red-600 text-white font-duo font-extrabold px-8 py-3.5 rounded-2xl transition shadow-[0_4px_0_#991b1b] active:translate-y-0.5 active:shadow-none cursor-pointer";
            }

            checkBtn.addEventListener('click', function() {
                if (!isChecked) {
                    isChecked = true;
                    userAnswers[currentQuestion] = selectedOption;
                    const correctOption = questions[currentQuestion].correct;
                    const isCorrect = selectedOption === correctOption;
                    const buttons = optionsContainer.children;

                    if (isCorrect) {
                        playSound('correct');
                        confetti({ particleCount: 70, spread: 70, origin: { y: 0.8 } });
                        
                        mascot.textContent = '🥳👒';
                        mascot.classList.add('animate-luffy-happy');
                        mascotSpeech.textContent = "SUGOI ! C'est exact ! Regarde ce trésor ! 💎";

                        buttons[selectedOption].className = "option-btn w-full text-left p-4 rounded-2xl border-2 border-green-600 bg-green-100 text-green-900 font-extrabold flex items-center justify-between";

                        footerBar.className = "border-t-4 border-green-600 bg-green-100 py-4 px-6";
                        feedbackMessage.className = "flex items-center gap-3 text-green-900";
                        feedbackIcon.textContent = "🎉";
                        feedbackTitle.textContent = "Victoire !";
                        feedbackSub.textContent = "Excellente réponse !";
                        
                        checkBtn.className = "ml-auto bg-green-600 hover:bg-green-700 text-white font-duo font-extrabold px-8 py-3.5 rounded-2xl transition shadow-[0_4px_0_#166534]";
                    } else {
                        playSound('wrong');
                        document.getElementById('question-card').classList.add('animate-shake');
                        setTimeout(() => document.getElementById('question-card').classList.remove('animate-shake'), 400);

                        mascot.textContent = '💢😠';
                        mascot.classList.add('animate-luffy-angry');
                        mascotSpeech.textContent = "Baka ! Tu as faux ! Je suis fâché ! 😡";

                        buttons[selectedOption].className = "option-btn w-full text-left p-4 rounded-2xl border-2 border-red-600 bg-red-100 text-red-900 font-extrabold flex items-center justify-between";
                        buttons[correctOption].className = "option-btn w-full text-left p-4 rounded-2xl border-2 border-green-600 bg-green-50 text-green-900 font-extrabold flex items-center justify-between";

                        footerBar.className = "border-t-4 border-red-600 bg-red-100 py-4 px-6";
                        feedbackMessage.className = "flex items-center gap-3 text-red-900";
                        feedbackIcon.textContent = "💢";
                        feedbackTitle.textContent = "Dommage !";
                        feedbackSub.textContent = `La bonne réponse était : ${questions[currentQuestion].options[correctOption]}`;

                        checkBtn.className = "ml-auto bg-red-600 hover:bg-red-700 text-white font-duo font-extrabold px-8 py-3.5 rounded-2xl transition shadow-[0_4px_0_#991b1b]";
                    }

                    checkBtn.textContent = "CONTINUER";
                } else {
                    if (currentQuestion < questions.length - 1) {
                        currentQuestion++;
                        loadQuestion();
                    } else {
                        showResults();
                    }
                }
            });

            function showResults() {
                quizContainer.classList.add('hidden');
                footerBar.classList.add('hidden');
                resultContainer.classList.remove('hidden');

                let score = 0;
                userAnswers.forEach((ans, idx) => {
                    if (ans === questions[idx].correct) score++;
                });

                document.getElementById('score-display').textContent = `${score} / ${questions.length}`;
                
                const feedback = document.getElementById('score-feedback');
                const resultMascot = document.getElementById('result-mascot');

                if (score === 20) {
                    resultMascot.textContent = "🏴‍☠️👑";
                    feedback.textContent = "KAIRITSU ! Tu es officiellement le Roi des Économistes !";
                    confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 } });
                } else if (score >= 14) {
                    resultMascot.textContent = "🍖🏆";
                    feedback.textContent = "Super capitaine ! Un équipage solide et de bonnes connaissances !";
                } else {
                    resultMascot.textContent = "⚓️📖";
                    feedback.textContent = "Il faut s'entraîner encore sur Grand Line (le cours) !";
                }
            }

            document.getElementById('restart-btn').addEventListener('click', function() {
                currentQuestion = 0;
                userAnswers = new Array(questions.length).fill(null);
                resultContainer.classList.add('hidden');
                quizContainer.classList.remove('hidden');
                footerBar.classList.remove('hidden');
                loadQuestion();
            });
        });
    </script>
</body>
</html>
